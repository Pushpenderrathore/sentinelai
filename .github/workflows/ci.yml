name: CI

on:
  push:
    branches: [master, main]
    # Without this a release is never built: pushing v1.0.0 triggered nothing,
    # so the tag people download had no CI run behind it and the only green
    # check on the release commit came from Vercel.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Backend: lint + unit tests ──────────────────────────────────────────────
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Gate on errors that mean the code is broken: syntax errors, undefined
      # names, invalid comparisons. Style is reported separately so a cosmetic
      # nit never blocks a merge.
      - name: Lint (blocking - correctness only)
        working-directory: backend
        run: ruff check . --select E9,F63,F7,F82 --output-format github

      - name: Lint (advisory - full ruleset)
        working-directory: backend
        continue-on-error: true
        run: ruff check . --output-format github

      - name: Unit tests
        working-directory: backend
        run: pytest

  # ── Frontend: type check + production build ────────────────────────────────
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Production build
        working-directory: frontend
        run: npm run build

  # ── Security: scan our own code with the tools we ship ─────────────────────
  self-scan:
    name: Security self-scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install scanners
        run: pip install bandit semgrep

      # Blocking: no medium-or-higher Bandit finding may land in our own code.
      # A security tool that ships insecure code is not credible.
      - name: Bandit (blocking - MEDIUM and above)
        run: bandit -r backend -x backend/.venv,backend/tests -ll -q

      - name: Bandit (full report)
        if: always()
        run: bandit -r backend -x backend/.venv,backend/tests -f json -o bandit-report.json -q || true

      # Advisory: the registry ruleset changes over time, so a new rule must not
      # break an unrelated pull request.
      - name: Semgrep (advisory)
        continue-on-error: true
        run: semgrep --config auto backend --json --output semgrep-report.json --quiet

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            semgrep-report.json
          if-no-files-found: ignore
          retention-days: 14

  # ── Dependencies: known CVEs in what we ship ───────────────────────────────
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit
        working-directory: frontend
        # Advisory: a newly published advisory against a transitive dependency
        # must not block an unrelated pull request. Read the summary in the log.
        continue-on-error: true
        run: npm audit --audit-level=high

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: pip-audit
        working-directory: backend
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  # ── Smoke: the API actually boots and answers ──────────────────────────────
  smoke:
    name: API smoke test
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Boot the API and check /health
        working-directory: backend
        env:
          # Deliberately no GROQ_API_KEY. A missing key must degrade to the
          # local backend, not crash the app - that regression killed every
          # scan on a machine with no key.
          ALLOW_PRIVATE_TARGETS: "false"
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health -o health.json; then
              break
            fi
            sleep 1
          done
          cat health.json
          python - <<'PY'
          import json, sys
          h = json.load(open("health.json"))
          assert h["status"] == "ok", h
          # No key configured, so the router must report the offline backend.
          assert h["llm_backend"] == "ollama", h
          # Hardware detection must work without psutil on a Linux runner.
          assert h["system_profile"]["ram_gb"] > 0, h
          assert h["system_profile"]["cpu_cores"] >= 1, h
          print("health check passed:", json.dumps(h))
          PY

  # ── Release: the tag must match what the software reports ──────────────────
  # v1.0.0 was tagged while backend/main.py and frontend/package.json still had
  # to be edited by hand to match. Nothing enforced that they agreed, so a tag
  # could claim one version while GET /health served another.
  release-version:
    name: Release version consistency
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Tag, backend and frontend must agree
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          BACKEND=$(grep -oE 'version="[^"]+"' backend/main.py | head -1 | cut -d'"' -f2)
          FRONTEND=$(node -p "require('./frontend/package.json').version")
          LOCKFILE=$(node -p "require('./frontend/package-lock.json').version")

          echo "tag:              $TAG"
          echo "backend/main.py:  $BACKEND"
          echo "package.json:     $FRONTEND"
          echo "package-lock.json:$LOCKFILE"

          fail=0
          if [ "$BACKEND" != "$TAG" ]; then
            echo "::error::backend/main.py reports $BACKEND but the tag is $TAG"
            fail=1
          fi
          if [ "$FRONTEND" != "$TAG" ]; then
            echo "::error::frontend/package.json is $FRONTEND but the tag is $TAG"
            fail=1
          fi
          if [ "$LOCKFILE" != "$TAG" ]; then
            echo "::error::frontend/package-lock.json is $LOCKFILE but the tag is $TAG"
            fail=1
          fi
          if [ "$fail" = "0" ]; then
            echo "All version strings match the tag."
          fi
          exit $fail
